<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#061a23" />
    </linearGradient>

    <!-- Emerald-Cyan Primary Gradient -->
    <linearGradient id="emeraldCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Dome Interior Gradient -->
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Background Decorative Islamic Radial Geometric Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#emeraldCyan)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.2" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#emeraldCyan)" stroke-width="1" opacity="0.1" />

  <!-- Ambient Central Glow -->
  <circle cx="256" cy="250" r="140" fill="#10b981" opacity="0.08" filter="blur(40px)" />

  <!-- Main Logo Mark with Glow & Shadow -->
  <g filter="url(#dropShadow)">
    
    <!-- 1. Stylized Crescent Moon (Hilal) -->
    <path d="M 275 88 C 172 88 90 170 90 273 C 90 376 174 458 277 458 C 335 458 387 431 420 389 C 330 412 232 368 200 282 C 172 208 214 125 292 94 C 286 90 280 88 275 88 Z"
          fill="url(#emeraldCyan)" />

    <!-- 2. Modern Grand Mosque Dome & Minaret Silhouette -->
    <!-- Mosque Main Dome Fill (Glass Arch effect) -->
    <path d="M 205 385 L 205 290 C 205 240 256 195 256 148 C 256 195 307 240 307 290 L 307 385 Z"
          fill="url(#domeGrad)"
          stroke="url(#emeraldCyan)"
          stroke-width="4"
          stroke-linejoin="round" />

    <!-- Dome Inner Archway Door -->
    <path d="M 234 385 L 234 320 C 234 300 256 288 256 288 C 256 288 278 300 278 320 L 278 385 Z"
          fill="url(#emeraldCyan)"
          opacity="0.75" />

    <!-- Dome Finial / Crescent Topper -->
    <circle cx="256" cy="142" r="5" fill="url(#goldGrad)" />
    <path d="M 256 137 L 256 122" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 256 122 C 252 122 249 119 249 115 C 249 111 252 108 256 108 C 254 110 253 113 253 115 C 253 117 254 120 256 122 Z" fill="url(#goldGrad)" />

    <!-- Minaret Tower (Right Accent) -->
    <path d="M 326 385 L 326 230 L 344 230 L 344 385 Z" fill="url(#domeGrad)" stroke="url(#emeraldCyan)" stroke-width="3" stroke-linejoin="round" />
    <!-- Minaret Balcony -->
    <path d="M 320 230 L 350 230" stroke="url(#emeraldCyan)" stroke-width="4" stroke-linecap="round" />
    <!-- Minaret Spire & Crescent -->
    <path d="M 326 230 C 326 205 335 185 335 185 C 335 185 344 205 344 230 Z" fill="url(#emeraldCyan)" />
    <circle cx="335" cy="180" r="3.5" fill="url(#goldGrad)" />

    <!-- Geometric Horizon Base Line -->
    <path d="M 140 385 L 380 385" stroke="url(#emeraldCyan)" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- 3. Radiant 8-Point Islamic Star (Kawkab / Rub el Hizb Sparkle) -->
    <g transform="translate(365, 115) scale(0.95)">
      <!-- Star Outer Glow -->
      <circle cx="0" cy="0" r="26" fill="#fbbf24" opacity="0.15" filter="blur(6px)" />
      
      <!-- Primary 4-Point Sparkle -->
      <path d="M 0 -32 Q 0 0 32 0 Q 0 0 0 32 Q 0 0 -32 0 Q 0 0 0 -32 Z" fill="url(#goldGrad)" />
      
      <!-- Diagonal 4-Point Sparkle -->
      <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#ffffff" transform="rotate(45)" opacity="0.85" />
      
      <!-- Center Bright Core -->
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Small Subsidiary Twinkling Stars -->
    <circle cx="165" cy="155" r="2.5" fill="#34d399" opacity="0.75" />
    <circle cx="395" cy="210" r="2" fill="#fde047" opacity="0.8" />
    <circle cx="130" cy="240" r="1.8" fill="#22d3ee" opacity="0.6" />
  </g>
</svg>
